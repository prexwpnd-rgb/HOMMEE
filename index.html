<!DOCTYPE html>
<html lang="th" class="h-full bg-slate-50">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PAKJAI Homestay & Local Experience Booking System</title>
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#f0fdf4',
                            100: '#dcfce7',
                            500: '#22c55e',
                            600: '#16a34a',
                            700: '#15803d',
                            800: '#166534',
                            900: '#14532d',
                        },
                        warm: {
                            50: '#fffbeb',
                            100: '#fef3c7',
                            500: '#f59e0b',
                            600: '#d97706',
                        }
                    },
                    fontFamily: {
                        sans: ['Kanit', 'Prompt', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <!-- FontAwesome 6 Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts: Kanit -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Alpine.js Core and Plugins -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>

    <style>
        body { font-family: 'Kanit', sans-serif; }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 9999px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        [x-cloak] { display: none !important; }
    </style>
</head>
<body class="h-full text-slate-800 antialiased" x-data="pakjaiApp()">

    <header class="bg-slate-900 text-white text-xs sm:text-sm py-2.5 px-4 shadow-lg sticky top-0 z-50">
        <div class="max-w-7xl mx-auto flex flex-wrap justify-between items-center gap-2">
            <div class="flex items-center space-x-2 font-semibold">
                <i class="fa-solid fa-house-chimney-window text-emerald-400 text-lg"></i>
                <span class="tracking-wide">PAKJAI Homestay (พักใจ โฮมสเตย์ 77 จังหวัด)</span>
                <span class="bg-emerald-800 text-emerald-200 px-2 py-0.5 rounded text-[10px] font-normal uppercase hidden sm:inline-block">3 Roles Control</span>
            </div>

            <!-- Role Switch & Profile Selector -->
            <div class="flex items-center space-x-2 flex-wrap">
                <!-- Host Profile Switcher (When Host role active) -->
                <template x-if="currentRole === 'host'">
                    <div class="flex items-center bg-slate-800 border border-emerald-500/40 rounded-full px-2 py-1 space-x-1">
                        <i class="fa-solid fa-user-circle text-amber-400 text-xs"></i>
                        <span class="text-[11px] text-slate-300 font-medium">สลับเจ้าของ:</span>
                        <select x-model.number="currentHostId" @change="onHostProfileChange()" class="bg-slate-900 text-amber-300 text-xs font-bold rounded px-1.5 py-0.5 outline-none border border-slate-700">
                            <template x-for="h in homestays" :key="h.id">
                                <option :value="h.id" x-text="`${h.ownerName} (${h.title})`"></option>
                            </template>
                        </select>
                    </div>
                </template>

                <!-- Role Switcher Buttons -->
                <div class="flex items-center bg-slate-950/80 rounded-full p-1 border border-slate-700">
                    <button @click="switchRole('user')" :class="currentRole === 'user' ? 'bg-emerald-500 text-white font-semibold shadow' : 'text-slate-300 hover:text-white'" class="px-2.5 py-1 rounded-full text-xs transition flex items-center space-x-1">
                        <i class="fa-solid fa-user"></i>
                        <span class="hidden sm:inline">ผู้ใช้งาน</span>
                    </button>

                    <button @click="switchRole('host')" :class="currentRole === 'host' ? 'bg-amber-500 text-slate-950 font-bold shadow' : 'text-slate-300 hover:text-white'" class="px-2.5 py-1 rounded-full text-xs transition flex items-center space-x-1">
                        <i class="fa-solid fa-store"></i>
                        <span>เจ้าของโฮมสเตย์</span>
                    </button>

                    <button @click="switchRole('admin')" :class="currentRole === 'admin' ? 'bg-purple-600 text-white font-semibold shadow' : 'text-slate-300 hover:text-white'" class="px-2.5 py-1 rounded-full text-xs transition flex items-center space-x-1">
                        <i class="fa-solid fa-user-shield"></i>
                        <span class="hidden sm:inline">ผู้ดูแลระบบ</span>
                    </button>
                </div>
            </div>
        </div>
    </header>

    <main class="min-h-[calc(100vh-48px)] flex flex-col">

        <!-- ROLE 1: TOURIST / USER -->
        <template x-if="currentRole === 'user'">
            <div class="flex-1 flex flex-col items-center justify-start py-4 px-2 sm:px-4 bg-slate-100">
                
                <div class="w-full max-w-6xl bg-white rounded-2xl shadow-lg border border-slate-200 min-h-[85vh] flex flex-col overflow-hidden my-auto">
                    
                    <!-- USER APP HEADER -->
                    <header class="bg-gradient-to-r from-emerald-700 via-teal-700 to-emerald-800 text-white px-5 py-4 shadow flex justify-between items-center shrink-0">
                        <div class="flex items-center space-x-3">
                            <div class="w-10 h-10 rounded-xl bg-white/20 flex items-center justify-center font-bold text-white border border-white/30 shadow-inner">
                                <i class="fa-solid fa-tree text-emerald-300 text-lg"></i>
                            </div>
                            <div>
                                <h1 class="font-bold text-base sm:text-lg leading-tight">พักใจ โฮมสเตย์ (PAKJAI Homestay)</h1>
                                <p class="text-xs text-emerald-100 font-light">สัมผัสเสน่ห์วิถีชุมชน จองที่พักและกิจกรรม 77 จังหวัดทั่วไทย</p>
                            </div>
                        </div>

                        <!-- Notification Bell with Counter -->
                        <div class="relative">
                            <button @click="userTab = 'notifications'" class="relative p-2.5 rounded-full hover:bg-white/10 transition">
                                <i class="fa-solid fa-bell text-xl"></i>
                                <template x-if="unreadNotificationsCount > 0">
                                    <span class="absolute top-1 right-1 w-4 h-4 bg-amber-400 text-slate-950 text-[10px] font-black rounded-full flex items-center justify-center animate-pulse" x-text="unreadNotificationsCount"></span>
                                </template>
                            </button>
                        </div>
                    </header>

                    <!-- USER BODY PANELS -->
                    <div class="flex-1 overflow-y-auto p-4 sm:p-6 space-y-6">

                        <!-- TAB 1: EXPLORE & CASCADING BOOKING -->
                        <div x-show="userTab === 'explore'" x-transition:enter="transition ease-out duration-200" x-transition:enter-start="opacity-0 translate-y-2" x-transition:enter-end="opacity-100 translate-y-0" class="space-y-6">
                            
                            <!-- Search & Filter Banner -->
                            <div class="bg-gradient-to-br from-emerald-700 to-teal-800 rounded-2xl p-5 text-white shadow-md relative overflow-hidden space-y-4">
                                <div class="relative z-10 space-y-3">
                                    <div class="flex justify-between items-center flex-wrap gap-2">
                                        <h2 class="text-lg font-bold flex items-center gap-2">
                                            <i class="fa-solid fa-map-location-dot text-amber-300"></i> ค้นหาโฮมสเตย์ตามจังหวัดที่ต้องการ
                                        </h2>
                                        <span class="text-xs bg-emerald-900/80 px-3 py-1 rounded-full text-emerald-200 font-medium border border-emerald-500/30">
                                            <i class="fa-solid fa-layer-group text-amber-300 mr-1"></i>เลือกจังหวัด -> โฮมสเตย์ -> กิจกรรม
                                        </span>
                                    </div>

                                    <!-- STEP 1: PROVINCE SELECTOR & SEARCH -->
                                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                                        <div class="relative">
                                            <label class="block text-xs text-emerald-100 font-light mb-1">1. เลือกจังหวัด (ครบ 77 จังหวัด)</label>
                                            <div class="relative">
                                                <i class="fa-solid fa-location-dot absolute left-3 top-3 text-emerald-600 z-10"></i>
                                                <select x-model="selectedProvince" @change="onProvinceChange()" class="w-full pl-9 pr-8 py-2.5 bg-white text-slate-900 font-semibold rounded-xl text-xs sm:text-sm focus:outline-none focus:ring-2 focus:ring-amber-400 shadow">
                                                    <template x-for="p in all77Provinces" :key="p">
                                                        <option :value="p" x-text="p"></option>
                                                    </template>
                                                </select>
                                            </div>
                                        </div>

                                        <!-- SEARCH INPUT -->
                                        <div class="relative">
                                            <label class="block text-xs text-emerald-100 font-light mb-1">2. ค้นหาชื่อโฮมสเตย์/กิจกรรม</label>
                                            <div class="relative">
                                                <i class="fa-solid fa-magnifying-glass absolute left-3 top-3 text-slate-400"></i>
                                                <input type="text" x-model="searchQuery" placeholder="พิมพ์ชื่อโฮมสเตย์, สถานที่..." class="w-full pl-9 pr-4 py-2.5 bg-white text-slate-800 placeholder-slate-400 rounded-xl text-xs sm:text-sm focus:outline-none focus:ring-2 focus:ring-amber-400 shadow">
                                            </div>
                                        </div>
                                    </div>

                                    <!-- CASCADING STATUS -->
                                    <div class="bg-emerald-950/60 backdrop-blur border border-emerald-400/30 rounded-xl p-3 text-xs text-emerald-100 flex flex-wrap items-center justify-between gap-2">
                                        <div class="flex items-center space-x-2 flex-wrap">
                                            <span class="font-bold text-amber-300"><i class="fa-solid fa-filter mr-1"></i>จังหวัดที่เลือก:</span>
                                            <span class="bg-emerald-800 px-2.5 py-1 rounded-lg text-white font-bold" x-text="selectedProvince"></span>
                                            <template x-if="selectedHomestay">
                                                <span class="flex items-center gap-1">
                                                    <i class="fa-solid fa-chevron-right text-[10px] text-emerald-300"></i>
                                                    <span class="bg-amber-500 text-slate-950 px-2.5 py-1 rounded-lg font-extrabold" x-text="selectedHomestay.title"></span>
                                                </span>
                                            </template>
                                        </div>
                                        <template x-if="selectedHomestay">
                                            <button @click="resetHomestaySelection()" class="text-xs text-amber-300 hover:underline flex items-center gap-1 font-medium">
                                                <i class="fa-solid fa-rotate-left"></i> แสดงโฮมสเตย์ทั้งหมดในจังหวัด
                                            </button>
                                        </template>
                                    </div>
                                </div>
                            </div>

                            <!-- STEP 2: HOMESTAYS LIST -->
                            <div class="space-y-3">
                                <div class="flex justify-between items-end">
                                    <div>
                                        <span class="text-[10px] font-bold text-emerald-700 bg-emerald-100 px-2.5 py-0.5 rounded-full uppercase">ขั้นตอนที่ 1/2</span>
                                        <h3 class="font-bold text-slate-900 text-base sm:text-lg flex items-center gap-2 mt-1">
                                            <i class="fa-solid fa-house-chimney text-emerald-600"></i>
                                            <span>โฮมสเตย์ในจังหวัด <span class="text-emerald-700 font-extrabold" x-text="selectedProvince"></span></span>
                                        </h3>
                                    </div>
                                    <span class="text-xs text-slate-500 font-medium" x-text="`${filteredHomestays.length} แห่ง`"></span>
                                </div>

                                <template x-if="filteredHomestays.length === 0">
                                    <div class="bg-amber-50 border border-amber-200 rounded-2xl p-8 text-center text-amber-900 space-y-2">
                                        <i class="fa-solid fa-circle-info text-3xl text-amber-500"></i>
                                        <p class="text-sm font-semibold">ยังไม่มีโฮมสเตย์ในจังหวัดนี้ หรือ ไม่ตรงกับคีย์เวิร์ดค้นหา</p>
                                        <p class="text-xs text-amber-700">ลองเลือกจังหวัดอื่นๆ เช่น เชียงใหม่, สมุทรสงคราม, นครศรีธรรมราช, น่าน ฯลฯ</p>
                                    </div>
                                </template>

                                <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5">
                                    <template x-for="item in filteredHomestays" :key="item.id">
                                        <div :class="selectedHomestay && selectedHomestay.id === item.id ? 'ring-2 ring-emerald-500 bg-emerald-50/20' : 'bg-white'" 
                                             class="rounded-2xl overflow-hidden border border-slate-200 shadow-sm hover:shadow-md transition duration-200 flex flex-col justify-between group">
                                            <div>
                                                <div class="relative h-48 overflow-hidden">
                                                    <img :src="item.image" :alt="item.title" class="w-full h-full object-cover group-hover:scale-105 transition duration-300" onerror="this.src='https://images.unsplash.com/photo-1587061949409-02df41d5e562?w=800'">
                                                    <div class="absolute top-2.5 right-2.5 bg-slate-900/80 backdrop-blur text-white text-xs px-2.5 py-1 rounded-full flex items-center space-x-1 font-semibold">
                                                        <i class="fa-solid fa-star text-amber-400"></i>
                                                        <span x-text="item.rating"></span>
                                                        <span class="text-slate-300 font-normal" x-text="`(${item.reviewsCount})`"></span>
                                                    </div>
                                                    <div class="absolute top-2.5 left-2.5 bg-emerald-800/90 text-emerald-100 text-[11px] px-2.5 py-1 rounded-lg font-medium shadow">
                                                        <i class="fa-solid fa-user text-amber-300 mr-1"></i><span x-text="`เจ้าของ: ${item.ownerName}`"></span>
                                                    </div>
                                                    <!-- Availability Tag -->
                                                    <div class="absolute bottom-2.5 left-2.5 px-3 py-1 rounded-lg text-xs font-bold shadow"
                                                         :class="item.availableRooms > 0 ? 'bg-emerald-500 text-white' : 'bg-rose-500 text-white'">
                                                         <span x-text="item.availableRooms > 0 ? `ว่าง ${item.availableRooms} / ${item.totalRooms} ห้อง` : 'ห้องพักเต็มแล้ว'"></span>
                                                    </div>
                                                </div>
                                                <div class="p-4 space-y-2">
                                                    <h4 class="font-bold text-slate-900 text-base leading-snug" x-text="item.title"></h4>
                                                    <p class="text-xs text-slate-500 flex items-center gap-1">
                                                        <i class="fa-solid fa-location-dot text-rose-500"></i> <span x-text="item.location"></span>
                                                    </p>
                                                    <p class="text-xs text-slate-600 line-clamp-2 leading-relaxed" x-text="item.description"></p>
                                                    <div class="flex flex-wrap gap-1 pt-1">
                                                        <template x-for="tag in item.tags" :key="tag">
                                                            <span class="text-[10px] bg-slate-100 text-slate-600 px-2.5 py-0.5 rounded-full border border-slate-200" x-text="tag"></span>
                                                        </template>
                                                    </div>
                                                </div>
                                            </div>
                                            <div class="p-4 pt-0 flex flex-col space-y-2 border-t border-slate-100 mt-2">
                                                <div class="flex justify-between items-center pt-2">
                                                    <div>
                                                        <span class="text-[11px] text-slate-400 block">ราคาเริ่มต้น</span>
                                                        <div class="text-base font-extrabold text-emerald-600">฿<span x-text="item.pricePerNight.toLocaleString()"></span> <span class="text-xs text-slate-500 font-normal">/คืน</span></div>
                                                    </div>
                                                    <button @click="selectHomestayForActivities(item)" 
                                                            class="px-3 py-1.5 bg-amber-500 hover:bg-amber-600 text-slate-950 rounded-xl text-xs font-bold transition flex items-center space-x-1 shadow">
                                                        <i class="fa-solid fa-arrow-down-short-wide"></i>
                                                        <span>ดูกิจกรรมชุมชน</span>
                                                    </button>
                                                </div>
                                                <button @click="openBookingModal('homestay', item)" 
                                                        :disabled="item.availableRooms <= 0"
                                                        :class="item.availableRooms > 0 ? 'bg-emerald-600 hover:bg-emerald-700 text-white' : 'bg-slate-300 text-slate-500 cursor-not-allowed'"
                                                        class="w-full py-2.5 rounded-xl text-xs font-bold shadow transition flex items-center justify-center space-x-1.5">
                                                    <i class="fa-solid fa-calendar-check"></i>
                                                    <span>จองห้องพักโฮมสเตย์นี้</span>
                                                </button>
                                            </div>
                                        </div>
                                    </template>
                                </div>
                            </div>

                            <!-- STEP 3: COMMUNITY ACTIVITIES -->
                            <div class="space-y-3 pt-6 border-t border-slate-200">
                                <div class="flex justify-between items-end">
                                    <div>
                                        <span class="text-[10px] font-bold text-teal-700 bg-teal-100 px-2.5 py-0.5 rounded-full uppercase">ขั้นตอนที่ 2/2</span>
                                        <h3 class="font-bold text-slate-900 text-base sm:text-lg flex items-center gap-2 mt-1">
                                            <i class="fa-solid fa-person-hiking text-teal-600"></i>
                                            <span>กิจกรรมท่องเที่ยวชุมชน <span class="text-teal-700 font-bold" x-text="selectedHomestay ? `ประจำ ${selectedHomestay.title}` : `ในจังหวัด ${selectedProvince}`"></span></span>
                                        </h3>
                                    </div>
                                    <span class="text-xs text-slate-500 font-medium" x-text="`${filteredActivities.length} กิจกรรม`"></span>
                                </div>

                                <template x-if="filteredActivities.length === 0">
                                    <div class="bg-slate-50 border border-slate-200 rounded-2xl p-6 text-center text-slate-500 space-y-1">
                                        <i class="fa-solid fa-calendar-xmark text-2xl text-slate-400"></i>
                                        <p class="text-xs font-medium">ยังไม่มีรายการกิจกรรมชุมชนเปิดบริการในโฮมสเตย์หรือจังหวัดนี้</p>
                                    </div>
                                </template>

                                <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5">
                                    <template x-for="act in filteredActivities" :key="act.id">
                                        <div class="bg-white rounded-2xl overflow-hidden border border-slate-200 shadow-sm hover:shadow-md transition duration-200 flex flex-col justify-between group">
                                            <div>
                                                <div class="relative h-44 overflow-hidden">
                                                    <img :src="act.image" :alt="act.title" class="w-full h-full object-cover group-hover:scale-105 transition duration-300" onerror="this.src='https://images.unsplash.com/photo-1544717305-2782549b5136?w=800'">
                                                    <div class="absolute bottom-2.5 left-2.5 bg-slate-900/80 backdrop-blur text-white text-xs px-2.5 py-1 rounded-lg font-semibold">
                                                        <i class="fa-solid fa-user-group text-amber-400 mr-1"></i>
                                                        <span x-text="act.availableSeats > 0 ? `ว่าง ${act.availableSeats} / ${act.totalSeats} ที่` : 'เต็มแล้ว'"></span>
                                                    </div>
                                                    <div class="absolute top-2.5 right-2.5 bg-teal-800/90 text-teal-100 text-[10px] px-2.5 py-1 rounded-lg font-medium shadow">
                                                        <i class="fa-solid fa-house-user mr-1"></i><span x-text="getHomestayTitleById(act.homestayId)"></span>
                                                    </div>
                                                </div>
                                                <div class="p-4 space-y-2">
                                                    <h4 class="font-bold text-slate-900 text-sm sm:text-base leading-snug" x-text="act.title"></h4>
                                                    <p class="text-xs text-slate-600 line-clamp-2 leading-relaxed" x-text="act.description"></p>
                                                    <div class="text-xs text-slate-500 flex items-center space-x-3 pt-1">
                                                        <span><i class="fa-regular fa-clock text-emerald-600 mr-1"></i><span x-text="act.duration"></span></span>
                                                        <span><i class="fa-solid fa-location-dot text-rose-500 mr-1"></i><span x-text="act.location"></span></span>
                                                    </div>
                                                </div>
                                            </div>
                                            <div class="p-4 pt-0 flex justify-between items-center border-t border-slate-100 mt-2">
                                                <div>
                                                    <span class="text-[11px] text-slate-400 block">ค่าบริการ</span>
                                                    <div class="text-base font-extrabold text-teal-700">฿<span x-text="act.pricePerPerson.toLocaleString()"></span> <span class="text-xs text-slate-500 font-normal">/ท่าน</span></div>
                                                </div>
                                                <button @click="openBookingModal('activity', act)" 
                                                        :disabled="act.availableSeats <= 0"
                                                        :class="act.availableSeats > 0 ? 'bg-teal-600 hover:bg-teal-700 text-white' : 'bg-slate-300 text-slate-500 cursor-not-allowed'"
                                                        class="px-4 py-2 rounded-xl text-xs font-bold shadow transition flex items-center space-x-1.5">
                                                    <i class="fa-solid fa-ticket"></i>
                                                    <span>จองกิจกรรม</span>
                                                </button>
                                            </div>
                                        </div>
                                    </template>
                                </div>
                            </div>

                        </div>

                        <!-- TAB 2: MY BOOKINGS HISTORY -->
                        <div x-show="userTab === 'bookings'" x-transition:enter="transition ease-out duration-200" x-transition:enter-start="opacity-0 translate-y-2" x-transition:enter-end="opacity-100 translate-y-0" class="space-y-4">
                            <h2 class="text-base sm:text-lg font-bold text-slate-900 flex items-center gap-2">
                                <i class="fa-solid fa-receipt text-emerald-600"></i> ประวัติการจองโฮมสเตย์และกิจกรรมของฉัน
                            </h2>

                            <template x-if="userBookings.length === 0">
                                <div class="text-center py-12 bg-white rounded-2xl border border-dashed border-slate-300 p-6 space-y-3">
                                    <i class="fa-regular fa-folder-open text-4xl text-slate-300"></i>
                                    <p class="text-sm text-slate-500">ยังไม่มีประวัติการจองใดๆ ในขณะนี้</p>
                                    <button @click="userTab = 'explore'" class="px-4 py-2 bg-emerald-600 text-white rounded-xl text-xs font-semibold shadow">ไปเลือกที่พักโฮมสเตย์</button>
                                </div>
                            </template>

                            <div class="space-y-3">
                                <template x-for="bk in userBookings" :key="bk.id">
                                    <div class="bg-white rounded-2xl p-4 sm:p-5 border border-slate-200 shadow-sm space-y-3 relative">
                                        <div class="flex justify-between items-start border-b border-slate-100 pb-3 flex-wrap gap-2">
                                            <div>

                // COMPUTED PROPERTIES & HELPERS
                get unreadNotificationsCount() {
                    return this.userNotifications.filter(n => !n.read).length;
                },

                get filteredHomestays() {
                    return this.homestays.filter(item => {
                        const matchProvince = item.province === this.selectedProvince;
                        const matchSearch = !this.searchQuery || 
                            item.title.toLowerCase().includes(this.searchQuery.toLowerCase()) ||
                            item.description.toLowerCase().includes(this.searchQuery.toLowerCase());
                        return matchProvince && matchSearch;
                    });
                },

                get filteredActivities() {
                    return this.activities.filter(act => {
                        if (this.selectedHomestay) {
                            return act.homestayId === this.selectedHomestay.id;
                        }
                        const parentHomestay = this.homestays.find(h => h.id === act.homestayId);
                        return parentHomestay && parentHomestay.province === this.selectedProvince;
                    });
                },

                get calculatedTotalPrice() {
                    if (!this.selectedItem) return 0;
                    if (this.bookingType === 'homestay') {
                        return (this.selectedItem.pricePerNight || 0) * (this.bookingForm.nights || 1) * (this.bookingForm.rooms || 1);
                    } else {
                        return (this.selectedItem.pricePerPerson || 0) * (this.bookingForm.persons || 1);
                    }
                },

                // HOST ROLE SPECIFIC SCOPED DATA
                get currentHostHomestay() {
                    return this.homestays.find(h => h.id === this.currentHostId) || this.homestays[0];
                },

                get currentHostActivities() {
                    if (!this.currentHostHomestay) return [];
                    return this.activities.filter(a => a.homestayId === this.currentHostHomestay.id);
                },

                get currentHostBookings() {
                    if (!this.currentHostHomestay) return [];
                    return this.userBookings.filter(b => b.homestayId === this.currentHostHomestay.id);
                },

                get hostTotalRevenue() {
                    return this.currentHostBookings.reduce((sum, b) => sum + b.totalPrice, 0) + 3800; // base mock revenue
                },

                get dashboardStats() {
                    const totalRevenue = this.userBookings.reduce((sum, b) => sum + b.totalPrice, 0) + 18500;
                    return {
                        dailyUsers: 1420,
                        totalRevenue: totalRevenue
                    }
                },

                // ACTIONS AND METHODS
                switchRole(role) {
                    this.currentRole = role;
                    if (role === 'host' && !this.currentHostId && this.homestays.length > 0) {
                        this.currentHostId = this.homestays[0].id;
                    }
                },

                onHostProfileChange() {
                    // Profile switched dynamically
                },

                onProvinceChange() {
                    this.selectedHomestay = null;
                },

                selectHomestayForActivities(homestay) {
                    this.selectedHomestay = homestay;
                },

                resetHomestaySelection() {
                    this.selectedHomestay = null;
                },

                getHomestayTitleById(id) {
                    const h = this.homestays.find(item => item.id === id);
                    return h ? h.title : 'โฮมสเตย์ชุมชน';
                },

                markAllNotificationsAsRead() {
                    this.userNotifications.forEach(n => n.read = true);
                },

                openBookingModal(type, item) {
                    this.bookingType = type;
                    this.selectedItem = item;
                    this.bookingForm = {
                        nights: 1,
                        rooms: 1,
                        persons: 1,
                        checkInDate: new Date().toISOString().split('T')[0],
                        activityDate: new Date().toISOString().split('T')[0]
                    };
                    this.showBookingModal = true;
                },

                processBookingSubmit() {
                    if (!this.selectedItem) return;

                    const newId = 'BK-' + Math.floor(1000 + Math.random() * 9000);
                    const totalPrice = this.calculatedTotalPrice;

                    // Deduct capacity
                    if (this.bookingType === 'homestay') {
                        this.selectedItem.availableRooms = Math.max(0, this.selectedItem.availableRooms - (this.bookingForm.rooms || 1));
                    } else {
                        this.selectedItem.availableSeats = Math.max(0, this.selectedItem.availableSeats - (this.bookingForm.persons || 1));
                    }

                    // Create Booking Record
                    const newBooking = {
                        id: newId,
                        homestayId: this.bookingType === 'homestay' ? this.selectedItem.id : this.selectedItem.homestayId,
                        itemName: this.selectedItem.title,
                        hostName: this.bookingType === 'homestay' ? this.selectedItem.ownerName : 'เจ้าของโฮมสเตย์',
                        type: this.bookingType,
                        province: this.selectedProvince,
                        date: this.bookingType === 'homestay' ? this.bookingForm.checkInDate : this.bookingForm.activityDate,
                        details: this.bookingType === 'homestay' ? `${this.bookingForm.nights} คืน (${this.bookingForm.rooms} ห้อง)` : `${this.bookingForm.persons} ท่าน`,
                        totalPrice: totalPrice,
                        status: 'รอเข้าพัก',
                        hasReviewed: false
                    };

                    this.userBookings.unshift(newBooking);

                    // Add Notification
                    this.userNotifications.unshift({
                        id: Date.now(),
                        title: 'การจองสำเร็จ!',
                        message: `ยืนยันการจอง ${this.selectedItem.title} เรียบร้อยแล้ว ยอดชำระ ฿${totalPrice.toLocaleString()}`,
                        time: 'เมื่อครู่นี้',
                        read: false,
                        type: 'info'
                    });

                    this.showBookingModal = false;
                    this.userTab = 'bookings';
                },

                openReviewModal(booking) {
                    this.selectedBookingForReview = booking;
                    this.reviewForm = { rating: 5, comment: '' };
                    this.showReviewModal = true;
                },

                submitReview() {
                    if (this.selectedBookingForReview) {
                        this.selectedBookingForReview.hasReviewed = true;
                    }
                    this.showReviewModal = false;
                },

                // ADMIN / HOST CRUD METHODS
                openAdminModal(type, action, item = null) {
                    this.adminModalType = type;
                    this.adminModalAction = action;
                    this.adminEditingId = item ? item.id : null;

                    if (action === 'edit' && item) {
                        this.adminForm = {
                            title: item.title,
                            ownerName: item.ownerName || 'เจ้าของโฮมสเตย์',
                            province: item.province || this.selectedProvince,
                            location: item.location,
                            homestayId: item.homestayId || (this.homestays[0] ? this.homestays[0].id : 1),
                            price: item.pricePerNight || item.pricePerPerson || 1000,
                            totalCapacity: item.totalRooms || item.totalSeats || 5,
                            availableCapacity: item.availableRooms || item.availableSeats || 5,
                            image: item.image,
                            description: item.description
                        };
                    } else {
                        this.adminForm = {
                            title: '',
                            ownerName: this.currentHostHomestay ? this.currentHostHomestay.ownerName : 'เจ้าของใหม่',
                            province: this.currentRole === 'host' ? this.currentHostHomestay.province : this.selectedProvince,
                            location: '',
                            homestayId: this.currentRole === 'host' ? this.currentHostHomestay.id : (this.homestays[0] ? this.homestays[0].id : 1),
                            price: 1000,
                            totalCapacity: 5,
                            availableCapacity: 5,
                            image: 'https://images.unsplash.com/photo-1587061949409-02df41d5e562?w=800',
                            description: ''
                        };
                    }
                    this.showAdminModal = true;
                },

                saveAdminItem() {
                    if (this.adminModalType === 'homestay') {
                        if (this.adminModalAction === 'add') {
                            const newHomestay = {
                                id: Date.now(),
                                ownerName: this.adminForm.ownerName,
                                title: this.adminForm.title,
                                province: this.adminForm.province,
                                location: this.adminForm.location,
                                description: this.adminForm.description,
                                pricePerNight: Number(this.adminForm.price),
                                rating: 5.0,
                                reviewsCount: 1,
                                totalRooms: Number(this.adminForm.totalCapacity),
                                availableRooms: Number(this.adminForm.availableCapacity),
                                tags: ['โฮมสเตย์ใหม่', 'รวมอาหารเช้า'],
                                image: this.adminForm.image
                            };
                            this.homestays.push(newHomestay);
                            if (this.currentRole === 'host') this.currentHostId = newHomestay.id;
                        } else {
                            const h = this.homestays.find(i => i.id === this.adminEditingId);
                            if (h) {
                                h.title = this.adminForm.title;
                                h.ownerName = this.adminForm.ownerName;
                                h.province = this.adminForm.province;
                                h.location = this.adminForm.location;
                                h.description = this.adminForm.description;
                                h.pricePerNight = Number(this.adminForm.price);
                                h.totalRooms = Number(this.adminForm.totalCapacity);
                                h.availableRooms = Number(this.adminForm.availableCapacity);
                                h.image = this.adminForm.image;
                            }
                        }
                    } else if (this.adminModalType === 'activity') {
                        if (this.adminModalAction === 'add') {
                            const newAct = {
                                id: Date.now(),
                                homestayId: Number(this.adminForm.homestayId),
                                title: this.adminForm.title,
                                location: this.adminForm.location,
                                description: this.adminForm.description,
                                pricePerPerson: Number(this.adminForm.price),
                                duration: '2 ชั่วโมง',
                                totalSeats: Number(this.adminForm.totalCapacity),
                                availableSeats: Number(this.adminForm.availableCapacity),
                                image: this.adminForm.image
                            };
                            this.activities.push(newAct);
                        } else {
                            const a = this.activities.find(i => i.id === this.adminEditingId);
                            if (a) {
                                a.title = this.adminForm.title;
                                a.homestayId = Number(this.adminForm.homestayId);
                                a.location = this.adminForm.location;
                                a.description = this.adminForm.description;
                                a.pricePerPerson = Number(this.adminForm.price);
                                a.totalSeats = Number(this.adminForm.totalCapacity);
                                a.availableSeats = Number(this.adminForm.availableCapacity);
                                a.image = this.adminForm.image;
                            }
                        }
                    }
                    this.showAdminModal = false;
                },

                deleteItem(type, id) {
                    if (type === 'homestay') {
                        this.homestays = this.homestays.filter(i => i.id !== id);
                        this.activities = this.activities.filter(a => a.homestayId !== id);
                        if (this.currentHostId === id && this.homestays.length > 0) {
                            this.currentHostId = this.homestays[0].id;
                        }
                    } else {
                        this.activities = this.activities.filter(i => i.id !== id);
                    }
                }
            };
        }
    </script>

</body>
